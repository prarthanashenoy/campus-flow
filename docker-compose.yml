services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-db
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
      POSTGRES_DB: campusflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
